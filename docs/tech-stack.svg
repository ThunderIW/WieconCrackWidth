<svg xmlns="http://www.w3.org/2000/svg" width="880" height="342" viewBox="0 0 880 342" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tech stack: NiceGUI for UI, pywebview for the native window, SQLModel over SQLite for data, fpdf2 for PDF export, pendulum for dates, PyInstaller for packaging, uv for env and deps, Python 3.12 or newer.">
  <!-- panel -->
  <rect x="0.5" y="0.5" width="879" height="341" rx="18" fill="#0f172a" stroke="#1e293b"/>

  <!-- header -->
  <text x="30" y="52" fill="#f8fafc" font-size="26" font-weight="700" letter-spacing="0.5">Tech stack</text>
  <text x="30" y="76" fill="#94a3b8" font-size="13">Native, portable Windows app · requires Python 3.12+</text>

  <!-- Row 1 -->
  <!-- card: UI / NiceGUI -->
  <g>
    <rect x="30" y="100" width="190" height="96" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="46" y="118" width="5" height="60" rx="2.5" fill="#3b82f6"/>
    <text x="62" y="134" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">UI</text>
    <text x="62" y="160" fill="#f1f5f9" font-size="19" font-weight="700">NiceGUI</text>
  </g>
  <!-- card: Native window / pywebview -->
  <g>
    <rect x="240" y="100" width="190" height="96" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="256" y="118" width="5" height="60" rx="2.5" fill="#14b8a6"/>
    <text x="272" y="134" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">NATIVE WINDOW</text>
    <text x="272" y="160" fill="#f1f5f9" font-size="19" font-weight="700">pywebview</text>
  </g>
  <!-- card: Data / ORM / SQLModel -->
  <g>
    <rect x="450" y="100" width="190" height="96" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="466" y="118" width="5" height="60" rx="2.5" fill="#8b5cf6"/>
    <text x="482" y="134" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">DATA / ORM</text>
    <text x="482" y="160" fill="#f1f5f9" font-size="19" font-weight="700">SQLModel</text>
    <text x="482" y="180" fill="#64748b" font-size="11">SQLite</text>
  </g>
  <!-- card: PDF export / fpdf2 -->
  <g>
    <rect x="660" y="100" width="190" height="96" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="676" y="118" width="5" height="60" rx="2.5" fill="#ef4444"/>
    <text x="692" y="134" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">PDF EXPORT</text>
    <text x="692" y="160" fill="#f1f5f9" font-size="19" font-weight="700">fpdf2</text>
  </g>

  <!-- Row 2 -->
  <!-- card: Dates / pendulum -->
  <g>
    <rect x="30" y="216" width="190" height="96" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="46" y="234" width="5" height="60" rx="2.5" fill="#f59e0b"/>
    <text x="62" y="250" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">DATES</text>
    <text x="62" y="276" fill="#f1f5f9" font-size="19" font-weight="700">pendulum</text>
  </g>
  <!-- card: Packaging / PyInstaller -->
  <g>
    <rect x="240" y="216" width="190" height="96" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="256" y="234" width="5" height="60" rx="2.5" fill="#10b981"/>
    <text x="272" y="250" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">PACKAGING</text>
    <text x="272" y="276" fill="#f1f5f9" font-size="19" font-weight="700">PyInstaller</text>
  </g>
  <!-- card: Env / deps / uv -->
  <g>
    <rect x="450" y="216" width="190" height="96" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="466" y="234" width="5" height="60" rx="2.5" fill="#ec4899"/>
    <text x="482" y="250" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">ENV / DEPS</text>
    <text x="482" y="276" fill="#f1f5f9" font-size="19" font-weight="700">uv</text>
    <text x="482" y="296" fill="#64748b" font-size="11">pyproject + uv.lock</text>
  </g>
  <!-- card: Language / Python -->
  <g>
    <rect x="660" y="216" width="190" height="96" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="676" y="234" width="5" height="60" rx="2.5" fill="#eab308"/>
    <text x="692" y="250" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">LANGUAGE</text>
    <text x="692" y="276" fill="#f1f5f9" font-size="19" font-weight="700">Python</text>
    <text x="692" y="296" fill="#64748b" font-size="11">3.12 or newer</text>
  </g>
</svg>
